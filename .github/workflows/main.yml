name: Build and Publish Zed Artifact for Windows
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Enable long paths in Windows
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
        shell: powershell
      
      - name: Checkout the repository
        uses: actions/checkout@v3
      - name: Install Rust
        run: rustup update
      - name: Install Rust wasm toolchain
        run: rustup target add wasm32-wasip1
      - name: Install Visual Studio with MSVC build tools
        run: |
          choco install visualstudio2022buildtools --package-parameters "--add Microsoft.VisualStudio.Component.VC.Tools.x86.x64 --add Microsoft.VisualStudio.Component.VC.ASAN --add Microsoft.VisualStudio.Component.VC.Redist.MSM --add Microsoft.VisualStudio.Component.VC.ATL --add Microsoft.VisualStudio.Component.VC.ATLMFC --add Microsoft.VisualStudio.Component.VC.v141.x86.x64 --add Microsoft.VisualStudio.Component.Windows10SDK"
          
      - name: Install Windows SDK
        run: choco install windows-sdk-10.1
      - name: Verify Rust installation
        run: rustc --version
      - name: Configure Git for long paths
        run: git config --system core.longpaths true
        
      - name: Set shorter cargo path
        run: |
          $env:CARGO_HOME = "C:\cargo"
          [System.Environment]::SetEnvironmentVariable('CARGO_HOME', 'C:\cargo', [System.EnvironmentVariableTarget]::Machine)
        shell: powershell
        
      - name: Configure environment for Spectre Mitigation
        run: |
          # Set environment variable to skip Spectre mitigation libraries requirement
          echo "CARGO_FEATURE_NO_SPECTRE_MITIGATION=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "RUSTFLAGS=-C target-feature=-spectre-v2" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        shell: powershell
        
      - name: Build Zed (Release)
        run: cargo build --release
      - name: Upload Zed binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: zed-binary
          path: target/release/zed.exe
          if-no-files-found: error
          retention-days: 7
  msys2:
    runs-on: windows-latest
    steps:
      - name: Enable long paths in Windows
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
        shell: powershell
        
      - name: Install MSYS2
        run: choco install msys2
      - name: Update MSYS2
        run: |
          C:\msys64\usr\bin\bash -lc "pacman -Syu --noconfirm"
      - name: Install Zed via MSYS2
        run: |
          C:\msys64\usr\bin\bash -lc "pacman -S mingw-w64-ucrt-x86_64-zed --noconfirm"
      - name: Upload MSYS2 Zed binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: msys2-zed-binary
          path: C:/msys64/mingw64/bin/zed.exe
          if-no-files-found: error
          retention-days: 7
